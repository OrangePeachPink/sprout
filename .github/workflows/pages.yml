name: pages (design library + web-flasher)

# Actions-deployed GitHub Pages (ADR-0032, amended #271). Deploys the docs/ design library
# BYTE-IDENTICALLY plus the ESP Web Tools web-flasher (the page + a board-aware manifest +
# the CI-built factory bins) as ONE same-origin Pages artifact.
#
# WHY Actions, not the legacy `main`//docs branch deploy: the flasher must fetch the ~1.2 MB
# factory .bin SAME-ORIGIN — GitHub's release-asset CDN sends no `access-control-allow-origin`
# so a browser fetch from the Pages origin is blocked — and the bins can't live in git either
# (over the repo's 1024 KB large-file guard; Pages doesn't serve git-LFS). CI builds them into
# the deploy artifact; they are NEVER committed. Full rationale: ADR-0032 Amendment (#271).
#
# ONE-TIME maintainer step after this merges: Settings → Pages → Source → "GitHub Actions".
# Until that flip, the build job succeeds (bins + artifact) but the deploy step reports the
# site isn't configured for Actions — dispatch this workflow once to prove the build, flip the
# setting, then re-dispatch (or push) to publish. The legacy branch deploy keeps serving until
# the flip, so there is no serving gap.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "firmware/**"
      - "tools/pages/**"
      - ".github/workflows/pages.yml"
  # #1697: publishing a release MUST redeploy the front door. Since #1650 the stable
  # channel is a projection of the latest release's signed assets — the projection is
  # sound, but until this trigger existed nothing scheduled it. Measured: v0.8.1
  # published 07-26T01:20Z and the next deploy landed 07-27T02:25Z, ~25 hours later,
  # and only because unrelated pushes happened to touch docs/**. For that whole window
  # the front door served the PREVIOUS release's bytes — correctly signed, correctly
  # checksum-verified against the OLD receipt, and wrong.
  #
  # Checksums prove integrity. Only a trigger proves freshness; a stale artifact
  # verifies perfectly against its own receipt.
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment (OIDC token for deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer main push supersedes a queued run, but never cancels an
# in-flight deploy — a half-published Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

# #1346: pin PlatformIO so the flasher bins are reproducible from a given ref.
# Must match sign-release.yml - the release path and the Pages path building the
# same commit with different toolchains is exactly the drift this closes.
env:
  PIO_VERSION: "6.1.19"

jobs:
  build:
    name: build site (design library + flasher + factory bins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # factory_bin.py stamps the short git rev into the manifest provenance

      - name: Set up uv (+ the locked Python)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.14" # pin uv (#254), matching the firmware CI job

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install PlatformIO
        run: pip install --quiet "platformio==${PIO_VERSION}"

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build the board-aware factory bins (classic + C5)
        run: |
          just build     # esp32dev -> sprout-esp32-factory.bin  + manifest-esp32.json
          just build-c5  # esp32c5  -> sprout-esp32c5-factory.bin + manifest-esp32c5.json

      - name: Assemble the Pages site (docs/ + flasher bins + combined manifest)
        env:
          # #1648: the stable channel downloads the latest release's signed assets.
          # `contents: read` is enough to read a published release's assets.
          GH_TOKEN: ${{ github.token }}
        run: |
          site="_site"
          mkdir -p "$site"
          cp -r docs/. "$site/"   # the design library (+ .nojekyll) serves byte-identically
          # ADR-0026 §6 forward-gate (#1012): the VERIFIED MARKER is the single source
          # of offer-truth - never "a build happened". factory_bin.py emits
          # manifest-<mcu>.json ONLY for boards in its WEB_FLASH_VERIFIED set, so both
          # the payload and the combine are driven from the manifests that EXIST.
          # Consequence: a board that compiles but is not marker-verified cannot appear
          # in the flasher even if someone adds its build to this workflow - the offer
          # follows verification, not the build matrix.
          shopt -s nullglob
          manifests=(firmware/.pio/build/*/manifest-*.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error title=No verified boards::factory_bin emitted no manifest; nothing may be offered from the flasher."
            exit 1
          fi
          # ship only the bins that sit beside a verified board's manifest
          for m in "${manifests[@]}"; do
            for b in "$(dirname "$m")"/sprout-*-factory.bin; do
              cp "$b" "$site/flash/"
            done
          done
          # classic stays --primary: its provenance is the page's pre-connect panel
          primary="firmware/.pio/build/esp32dev/manifest-esp32.json"
          if [ ! -f "$primary" ]; then
            echo "::error title=Classic not verified::the primary board has no manifest; refusing to publish a flasher without it."
            exit 1
          fi
          extra=()
          for m in "${manifests[@]}"; do
            [ "$m" = "$primary" ] || extra+=("$m")
          done
          echo "verified boards offered: ${#manifests[@]}"
          built_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ALPHA = current `main`, which is exactly what this job just built. This is
          # the ONLY manifest the from-main build may write (#1599, #1648).
          python3 tools/pages/build_flash_manifest.py \
            --primary "$primary" "${extra[@]}" \
            --built-utc "$built_utc" \
            --out "$site/flash/manifest-alpha.json"

          # ---------------------------------------------------------------- STABLE
          # #1648: stable serves the RELEASE's signed bytes, never a rebuild of `main`.
          #
          # Until now this job wrote the same built-from-main artifacts under two names,
          # so the default CTA — no checkbox, the thing a stranger clicks — offered an
          # UNSIGNED build that existed in no release and labelled itself alpha. Measured
          # post-v0.8.1: front door `0.8.1-alpha` sha bcba7293…, release `0.8.1` sha
          # ec0b98d6…. Different bytes. The signer was taught to label honestly (#1630);
          # the server was never taught to ask for the signed thing.
          #
          # Why COPY the bytes instead of linking the release:
          #   1. A release asset 302s to release-assets.githubusercontent.com with NO
          #      access-control-allow-origin — ESP Web Tools runs in the browser and
          #      cannot fetch it. (Same reason the bins are same-origin today.)
          #   2. That redirect target is a SIGNED, TIME-LIMITED URL (~1h). A baked-in
          #      link would be dead long before anyone clicked it.
          # So the only correct stable channel is: fetch the release's assets here,
          # verify them against the release's own SHA256SUMS, and serve those bytes.
          #
          # FAIL CLOSED, exactly as alpha does: no release with assets, or a checksum
          # that disagrees, publishes NO stable manifest. The page then offers no stable
          # channel rather than a wrong one — an unpublished channel is not offered.
          mkdir -p "$site/flash/stable"
          # Download EVERY asset, not a filtered subset: SHA256SUMS lists the .sig files
          # too, and `sha256sum -c` fails on a listed file that isn't there. Fetching a
          # narrower pattern would take stable dark on every deploy — verified against
          # the real v0.8.1 assets. Serving the .sig bytes same-origin is a bonus: a
          # reader can verify the signature on what they just flashed.
          if gh release download --repo "$GITHUB_REPOSITORY" --dir "$site/flash/stable" \
               --pattern '*' --clobber 2>/dev/null \
             && [ -s "$site/flash/stable/SHA256SUMS" ]; then
            # Verify the bytes we just fetched are the bytes the release recorded. A
            # mismatch means the artifact is not what the receipt says, and serving it
            # would be worse than serving nothing.
            ( cd "$site/flash/stable" && sha256sum -c SHA256SUMS ) || {
              echo "::error title=Release checksum mismatch::the downloaded release assets do not match their SHA256SUMS; refusing to publish a stable channel."
              exit 1
            }
            stable_primary="$site/flash/stable/manifest-esp32.json"
            if [ -f "$stable_primary" ]; then
              stable_extra=()
              for m in "$site"/flash/stable/manifest-*.json; do
                [ "$m" = "$stable_primary" ] || stable_extra+=("$m")
              done
              # The combined manifest stays at ./manifest.json — the URL the page
              # fetches — but its parts point into stable/, because both channels emit
              # the SAME bin filenames and only one set may win at flash/<name>.
              python3 tools/pages/build_flash_manifest.py \
                --primary "$stable_primary" "${stable_extra[@]}" \
                --built-utc "$built_utc" \
                --parts-prefix "stable/" \
                --out "$site/flash/manifest.json"
              # Name the tag in the log. #1697's window was invisible partly because
              # the run said only "the latest release" — which is true at every moment
              # and therefore evidence of nothing. A run that records WHICH release it
              # projected makes staleness legible after the fact.
              stable_tag="$(jq -r '.provenance.release_tag // "unknown"' \
                "$site/flash/manifest.json" 2>/dev/null || echo unknown)"
              echo "stable channel: projected from release ${stable_tag}"
            else
              echo "::warning title=No stable manifest::the latest release has no manifest-esp32.json; stable will not be offered."
            fi
          else
            echo "::warning title=No release assets::no release carries flasher assets yet; stable will not be offered (fail-closed, #1648)."
          fi

          # Fail closed on ALPHA (unchanged, #1599): the page reveals the alpha panel only
          # if its manifest fetches, so a silently-unwritten file would re-hide it.
          [ -s "$site/flash/manifest-alpha.json" ] || {
            echo "::error title=Alpha manifest missing::manifest-alpha.json was not written; the flasher would hide that channel."
            exit 1
          }
          echo "== flasher payload ==" && ls -lR "$site/flash/"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
